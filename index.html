<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cisco Router Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

.login-box{
    width:350px;
    margin:80px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    color:#1b4f72;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
}

button{
    background:#0070c0;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

button:hover{
    background:#005999;
}

.warning{
    margin-top:15px;
    color:red;
    font-weight:bold;
}

/* Panel oculto */
#panelOculto{
    position: fixed;
    top: 20px;
    right: 20px;
    width: 300px;
    background: white;
    border: 2px solid #333;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    display: none;
}

#panelOculto h3{
    margin-top: 0;
}

.registro{
    border-bottom:1px solid #ddd;
    padding:8px 0;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Cisco Router Login</h2>

    <form onsubmit="showDemo(event)">
        <input type="text" id="usuario" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Iniciar sesión</button>
    </form>

    <p class="warning" id="mensaje"></p>
</div>

<!-- Panel oculto -->
<div id="panelOculto">
    <h3>Panel de demostración</h3>
    <div id="registros"></div>
</div>

<script>
function showDemo(event){
    event.preventDefault();

    let usuario = document.getElementById("usuario").value;
    let password = document.getElementById("password").value;

    // Agrega al panel oculto
    let registros = document.getElementById("registros");

    registros.innerHTML += `
        <div class="registro">
            <strong>Usuario:</strong> ${usuario}<br>
            <strong>Contraseña:</strong> ${password}
        </div>
    `;

    document.getElementById("mensaje").innerHTML =
    "Acceso denegado. Verifique credenciales.";

    document.querySelector("form").reset();
}

// Tecla secreta CTRL + SHIFT + P
document.addEventListener("keydown", function(event){
    if(event.ctrlKey && event.shiftKey && event.key === "P"){
        let panel = document.getElementById("panelOculto");

        panel.style.display =
            panel.style.display === "none"
            ? "block"
            : "none";
    }
});
</script>

</body>
</html>
